name: fleet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.6.9
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, where '.[dev]' is not a quoted
    # extras spec. bash exists on all three runners, so the steps stay one
    # script rather than three.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          # Anyone cloning this is far more likely to be on a laptop than on
          # Ubuntu, so macOS and Windows are tested rather than assumed. Both
          # run the newest supported Python; the version sweep stays on Linux.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
      - run: pytest -q --cov=fleet_loop --cov-report=term-missing

  the-loop-must-close:
    # Every other job here checks a part. This one checks the claim, and it is
    # the one that should fail if any part quietly stops working: a fleet
    # improving from its own data, on a fraction of it, without shipping a
    # regression.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -e '.[dev]'

      - name: The task must discriminate before any number from it is believed
        # A suite on which a do-nothing policy scores well is measuring the
        # environment rather than the policy.
        run: fleet-loop anchors --episodes 40

      - name: The premise — one policy is not good on every node
        run: |
          pytest -q \
            tests/test_dataset_and_train.py::test_a_policy_trained_on_one_environment_does_not_generalise \
            tests/test_dataset_and_train.py::test_training_on_fleet_data_closes_the_gap

      - name: The loop closes, on a fraction of the data
        run: |
          pytest -q \
            tests/test_loop.py::test_the_fleet_gets_better_from_its_own_data \
            tests/test_loop.py::test_the_loop_closes_on_a_fraction_of_the_data \
            tests/test_loop.py::test_every_episode_is_measured_even_though_most_are_not_collected \
            tests/test_loop.py::test_the_shipped_set_is_not_only_failures

      - name: A regression no pre-flight check can see is caught and undone
        run: pytest -q tests/test_loop.py::test_a_regression_the_hub_cannot_simulate_is_caught_by_the_fleet

      - name: Nothing is promoted without evidence, and nothing without a cohort
        run: |
          pytest -q \
            tests/test_loop.py::test_promotion_happens_on_fleet_evidence_not_on_a_timer \
            tests/test_loop.py::test_a_release_reaches_a_cohort_before_the_fleet \
            tests/test_loop.py::test_every_release_is_traceable_to_the_data_that_produced_it

      - name: The gate must refuse what it cannot resolve
        # A comparison whose interval is wider than the tolerance it is testing
        # has not shown a release is safe. If INCONCLUSIVE stops happening, the
        # gate has started manufacturing confidence.
        run: |
          pytest -q \
            tests/test_canary.py::test_a_difference_the_run_cannot_resolve_is_inconclusive \
            tests/test_canary.py::test_an_identical_policy_needs_the_study_the_power_calculation_asks_for \
            tests/test_canary.py::test_only_nodes_that_ran_both_versions_count \
            tests/test_canary.py::test_a_release_that_collapses_on_one_node_is_refused

      - name: Bad fleet data must never reach the training set
        run: pytest -q tests/test_ingest.py

      - name: Run it for real and summarise
        run: |
          fleet-loop run --rounds 8 --root "$RUNNER_TEMP/fleet" --html "$RUNNER_TEMP/fleet.html" \
            | tee "$RUNNER_TEMP/loop.txt"
          {
            echo '## The loop'
            echo '```'
            tail -n 24 "$RUNNER_TEMP/loop.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-dashboard
          path: ${{ runner.temp }}/fleet.html
          retention-days: 14
